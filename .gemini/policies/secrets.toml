[[rule]]
toolName = ["read_file", "read_many_files", "grep_search", "glob", "list_directory"]
argsPattern = '''(\.env(\.(local|development|staging|production|test))?(?![\w.-])|\.(pem|key|p12|secret)(?![\w.-])|/secrets/|credentials[^/"]*\.json|/\.ssh/|/\.aws/|/\.gnupg/|/\.config/gcloud|/\.config/gh/|\.netrc|\.npmrc|\.docker/config\.json)'''
decision = "deny"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = '''\.env(\.(local|development|staging|production|test))?([^\w.-]|$)'''
decision = "deny"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = '''\.(pem|key|p12|secret)([^\w.-]|$)'''
decision = "deny"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = '''(/secrets/|\.ssh/|\.aws/|\.gnupg/|\.config/gcloud|\.config/gh/|\.netrc|\.npmrc|\.docker/config\.json)'''
decision = "deny"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = '''credentials[^/"]*\.json'''
decision = "deny"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = '''printenv'''
decision = "deny"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandRegex = '''(env|export|set)("|[;&|])'''
decision = "deny"
priority = 900
