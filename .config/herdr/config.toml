onboarding = false

[update]
channel = "stable"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[theme]
name = "gruvbox"
auto_switch = false

[ui]
sidebar_width = 32
mouse_capture = true
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = false

[keys]
prefix = "ctrl+a"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"

split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"
rename_pane = "prefix+shift+p"

new_tab = "prefix+c"
previous_tab = ["prefix+p", "prefix+ctrl+p"]
next_tab = ["prefix+n", "prefix+ctrl+n"]
switch_tab = "prefix+1..9"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"

new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
workspace_picker = "prefix+w"
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"

detach = "prefix+q"
copy_mode = "prefix+["
edit_scrollback = "prefix+e"
toggle_sidebar = "prefix+b"
goto = "prefix+g"
last_pane = "prefix+tab"
cycle_pane_next = "prefix+ctrl+tab"
cycle_pane_previous = "prefix+shift+tab"
reload_config = "prefix+shift+r"

navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[[keys.command]]
key = "ctrl+alt+shift+l"
type = "shell"
command = "/Users/rightsvn-hunga/dotfiles/scripts/herdr-clear-pane"
description = "clear pane screen (wezterm cmd+k)"

[[keys.command]]
key = "prefix+f"
type = "popup"
width = "80%"
height = "80%"
command = "/Users/rightsvn-hunga/dotfiles/scripts/herdr-sessionizer"
description = "sessionizer"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "/Users/rightsvn-hunga/dotfiles/scripts/herdr-clear-pane"
description = "clear pane screen"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
width = "80%"
height = "80%"
command = "lazygit"
description = "lazygit"

[[keys.command]]
key = "prefix+shift+c"
type = "pane"
command = "claude"
description = "claude code"

[[keys.command]]
key = "prefix+shift+e"
type = "pane"
command = "nvim"
description = "neovim"

[[keys.command]]
key = "prefix+shift+s"
type = "pane"
command = "bundle exec rails server"
description = "rails server"
