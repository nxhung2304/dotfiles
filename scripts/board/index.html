<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board</title>
<style>
  :root {
    --background: #f7f7f5;
    --surface: #ffffff;
    --surface-hover: #f0efeb;
    --border: #e4e3de;
    --text: #1d1d1b;
    --text-muted: #73726b;
    --text-faint: #a3a29b;
    --accent: #2f6fde;
    --needs-you: #d9480f;
    --needs-you-surface: #fff1e8;
    --next: #1f8a4c;
    --next-surface: #eaf6ee;
    --danger: #c43c2f;
    --warning-surface: #fff4d6;
    --warning-text: #7a5600;
    --related: #e8f0ff;
    --merged: #8250df;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #141413;
      --surface: #1c1c1a;
      --surface-hover: #252523;
      --border: #2e2d2a;
      --text: #e9e8e3;
      --text-muted: #9a988f;
      --text-faint: #65645e;
      --accent: #6c9cf0;
      --needs-you: #ff8a4c;
      --needs-you-surface: #33200f;
      --next: #5fcf8d;
      --next-surface: #13291c;
      --danger: #ef7064;
      --warning-surface: #3a2f12;
      --warning-text: #f2cf74;
      --related: #1f2d47;
      --merged: #b48cf2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font: 14px/1.45 var(--font-body);
  }
  .page { max-width: 880px; margin: 0 auto; padding: var(--space-6) var(--space-4) 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .updated { color: var(--text-faint); font-size: 12px; font-family: var(--font-mono); }
  .summary { margin: var(--space-1) 0 var(--space-4); color: var(--text-muted); font-size: 13px; }
  .summary strong { color: var(--text); font-weight: 600; }
  .summary .needs-you strong { color: var(--needs-you); }
  #banner {
    margin-bottom: var(--space-4);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius);
    background: var(--warning-surface);
    color: var(--warning-text);
    font-size: 13px;
    white-space: pre-line;
  }
  #banner:empty { display: none; }
  section { margin-bottom: var(--space-6); }
  section h2 {
    display: flex;
    gap: var(--space-2);
    align-items: baseline;
    margin: 0 0 var(--space-2);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  section h2 .count { font-family: var(--font-mono); color: var(--text-faint); }
  section.needs-you h2 { color: var(--needs-you); }
  .list { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: var(--space-3);
    align-items: center;
    padding: 10px var(--space-3);
    border-top: 1px solid var(--border);
  }
  .row:first-child { border-top: none; }
  .row.clickable { cursor: pointer; }
  .row.clickable:hover { background: var(--surface-hover); }
  .row.related { background: var(--related); }
  .row.is-next { background: var(--next-surface); }
  section.needs-you .row { background: var(--needs-you-surface); }
  section.blocked .row .title, section.done .row .title { color: var(--text-muted); font-weight: 400; }
  .number { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }
  .title { font-weight: 500; overflow-wrap: anywhere; }
  .meta { margin-top: 2px; font-size: 12px; color: var(--text-muted); }
  .meta .blocked-by { color: var(--danger); }
  .diff-stats { margin-top: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .diff-stats .insertions { color: var(--next); }
  .diff-stats .deletions { color: var(--danger); }
  .diff-stats .dirty { color: var(--warning-text); }
  .preview {
    margin-top: 6px;
    padding: 6px var(--space-2);
    border-left: 2px solid var(--border);
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-muted);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  section.needs-you .preview { border-left-color: var(--needs-you); color: var(--text); }
  .ref .signal { font-size: 11px; }
  .ref .signal.bad { color: var(--danger); }
  .ref .signal.good { color: var(--next); }
  .ref .signal.waiting { color: var(--warning-text); }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .refs { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: 6px; }
  .ref {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 7px 1px 5px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    background: var(--surface);
  }
  .ref:hover { border-color: var(--text-muted); color: var(--text); }
  .ref svg { width: 14px; height: 14px; flex: none; }
  .ref .kind { font-weight: 600; color: var(--text); }
  .ref .state { font-size: 11px; }
  .ref.issue svg { color: var(--text-muted); }
  .ref.pr-open svg, .ref.pr-open .state { color: var(--next); }
  .ref.pr-draft svg, .ref.pr-draft .state { color: var(--text-faint); }
  .ref.pr-merged svg, .ref.pr-merged .state { color: var(--merged); }
  .ref.pr-closed svg, .ref.pr-closed .state { color: var(--danger); }
  .tag { font-size: 11px; font-weight: 600; margin-right: var(--space-2); }
  .tag.next { color: var(--next); }
  .tag.p1 { color: var(--danger); }
  .tag.p3 { color: var(--text-faint); }
  .tag.unapproved { color: var(--warning-text); font-weight: 400; }
  button {
    font: inherit;
    font-size: 12px;
    padding: var(--space-1) 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--text-muted); }
  button.primary { background: var(--next); border-color: var(--next); color: var(--surface); }
  section.needs-you button { background: var(--needs-you); border-color: var(--needs-you); color: var(--surface); }
  button:disabled { opacity: 0.5; cursor: progress; }
  .empty-hint {
    padding: var(--space-3);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-muted);
    font-size: 13px;
  }
  .toggle { margin-top: var(--space-2); border: none; background: none; color: var(--accent); padding: 0; }
  @media (max-width: 560px) {
    .row { grid-template-columns: 36px 1fr; }
    .row > :nth-child(3) { grid-column: 2; justify-self: start; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="repo-name">Task Board</h1>
    <span class="updated" id="updated-at"></span>
  </header>
  <div class="summary" id="summary"></div>
  <div id="banner"></div>
  <main id="board"></main>
</div>
<script>
  const BOARD_REFRESH_MS = 3000;
  const WORK_IN_PROGRESS_LIMIT = 3;
  const RECENT_DONE_COUNT = 5;
  const SHORT_TITLE_LENGTH = 32;
  const SECTIONS = [
    { key: "needsYou", label: "Cần anh", className: "needs-you" },
    { key: "inProgress", label: "Đang làm" },
    { key: "review", label: "Review" },
    { key: "ready", label: "Sẵn sàng" },
    { key: "todo", label: "Bị chặn", className: "blocked" },
    { key: "done", label: "Xong", className: "done" },
  ];
  const ACTIVE_COLUMNS = ["inProgress", "needsYou"];
  const SVG_NAMESPACE = "http://www.w3.org/2000/svg";
  const ISSUE_ICON_PATHS = [
    "M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z",
    "M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z",
  ];
  const PULL_REQUEST_ICON_PATHS = [
    "M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z",
  ];
  const PULL_REQUEST_STATES = {
    draft: { label: "nháp", className: "pr-draft" },
    OPEN: { label: "đang mở", className: "pr-open" },
    MERGED: { label: "đã merge", className: "pr-merged" },
    CLOSED: { label: "đã đóng", className: "pr-closed" },
  };
  const SUMMARY_PARTS = [
    { key: "needsYou", label: "cần anh", className: "needs-you" },
    { key: "inProgress", label: "đang làm" },
    { key: "review", label: "review" },
    { key: "ready", label: "sẵn sàng" },
    { key: "todo", label: "bị chặn" },
    { key: "done", label: "xong" },
  ];

  let currentTasks = [];
  let lastRenderedJson = "";
  let actionMessage = "";
  let currentWarnings = [];
  let githubWebUrl = null;
  let isDoneExpanded = false;
  let isIssuesWithoutSpecExpanded = false;
  let issuesWithoutSpec = [];
  let unlinkedWorktrees = [];
  const CHECK_SIGNALS = {
    failing: { label: "CI lỗi", tone: "bad" },
    pending: { label: "CI đang chạy", tone: "waiting" },
    passing: { label: "CI đạt", tone: "good" },
  };
  const REVIEW_SIGNALS = {
    CHANGES_REQUESTED: { label: "cần sửa", tone: "bad" },
    REVIEW_REQUIRED: { label: "chờ review", tone: "waiting" },
    APPROVED: { label: "đã duyệt", tone: "good" },
  };
  const startingTaskIds = new Set();

  function createElement(tagName, className, text) {
    const element = document.createElement(tagName);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  }

  function tasksIn(column) {
    return currentTasks.filter((task) => task.column === column);
  }

  function shortName(taskId) {
    const task = currentTasks.find((candidate) => candidate.id === taskId);
    if (!task) return taskId;
    const title = task.title.length > SHORT_TITLE_LENGTH ? `${task.title.slice(0, SHORT_TITLE_LENGTH)}…` : task.title;
    return task.number ? `#${task.number} ${title}` : title;
  }

  async function postAction(actionPath, taskId) {
    const response = await fetch(actionPath, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ taskId }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error);
    return body;
  }

  async function runAction(actionPath, taskId, successMessage) {
    try {
      actionMessage = successMessage(await postAction(actionPath, taskId));
    } catch (error) {
      actionMessage = `Lỗi: ${error.message}`;
    }
    lastRenderedJson = "";
    await refreshBoard();
  }

  function confirmStart(task) {
    const activeCount = currentTasks.filter((candidate) => ACTIVE_COLUMNS.includes(candidate.column)).length;
    const questions = [];
    if (activeCount >= WORK_IN_PROGRESS_LIMIT) questions.push(`Đang có ${activeCount} task chạy song song.`);
    if (task.unresolvedDependencies.length > 0) {
      const tokens = task.unresolvedDependencies.map((dependency) => dependency.unresolvedToken).join(", ");
      questions.push(`Phụ thuộc chưa xác định: ${tokens}.`);
    }
    if (questions.length === 0) return true;
    return window.confirm(`${questions.join("\n")}\nVẫn bắt đầu ${shortName(task.id)}?`);
  }

  async function startTask(task) {
    if (!confirmStart(task)) return;
    startingTaskIds.add(task.id);
    actionMessage = `Đang mở worktree cho ${shortName(task.id)}…`;
    lastRenderedJson = "";
    render();
    await runAction("/api/start", task.id, (result) =>
      result.isPromptSent
        ? `Đã mở ${result.branch} và gửi lệnh cho Claude.`
        : `Đã tạo ${result.branch} nhưng chưa gửi được lệnh (${result.warning}). Gõ tay trong tab đó:\n${result.prompt}`,
    );
    startingTaskIds.delete(task.id);
  }

  function focusTask(task) {
    runAction("/api/focus", task.id, () => `Đã chuyển sang tab của ${shortName(task.id)}.`);
  }

  function highlightRelated(task, isOn) {
    const relatedIds = new Set([
      ...task.dependsOn,
      ...currentTasks.filter((candidate) => candidate.dependsOn.includes(task.id)).map((candidate) => candidate.id),
    ]);
    document.querySelectorAll(".row").forEach((row) => {
      row.classList.toggle("related", isOn && relatedIds.has(row.dataset.taskId));
    });
  }

  function appendPriorityTags(meta, task) {
    if (task.priority === "P1") meta.append(createElement("span", "tag p1", "P1"));
    if (task.priority === "P3") meta.append(createElement("span", "tag p3", "P3"));
  }

  function describeMeta(task, isNext) {
    const meta = createElement("div", "meta");
    if (isNext) meta.append(createElement("span", "tag next", "Tiếp theo"));
    if (task.column !== "done") appendPriorityTags(meta, task);
    if (task.onlyInBranch) meta.append(createElement("span", "blocked-by", `spec chỉ có trên ${task.onlyInBranch}, merge về để bắt đầu`));
    if (task.column === "ready" && task.specPath.endsWith("/issue.md")) {
      meta.append(createElement("span", "tag unapproved", "chưa có spec · Claude sẽ đọc thư mục issue rồi hỏi anh bước tiếp"));
    } else if (task.column === "ready" && !task.isApproved) {
      meta.append(createElement("span", "tag unapproved", "chưa duyệt · sẽ chạy review spec"));
    }
    if (task.column === "todo" && !task.onlyInBranch) {
      const waitingFor = [...task.blockedBy.map(shortName), ...task.unresolvedDependencies.map((dependency) => dependency.unresolvedToken)];
      meta.append(createElement("span", "blocked-by", `chờ ${waitingFor.join(", ")}`));
    }
    if (task.column === "needsYou" && task.previewLines.length === 0) meta.append("Claude đang chờ anh trả lời");
    if (task.column === "inProgress") meta.append(task.agent ? `Claude: ${task.agent.status}` : "chưa có phiên Claude");
    return meta.childNodes.length > 0 ? meta : null;
  }

  function buildIcon(paths) {
    const svg = document.createElementNS(SVG_NAMESPACE, "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("fill", "currentColor");
    svg.setAttribute("aria-hidden", "true");
    for (const pathData of paths) {
      const path = document.createElementNS(SVG_NAMESPACE, "path");
      path.setAttribute("d", pathData);
      path.setAttribute("fill-rule", "evenodd");
      svg.append(path);
    }
    return svg;
  }

  function buildReference({ className, iconPaths, kind, number, url, stateLabel, signals = [] }) {
    const link = createElement("a", `ref ${className}`);
    link.href = url;
    link.target = "_blank";
    link.title = `Mở ${kind} #${number} trên GitHub`;
    link.append(buildIcon(iconPaths), createElement("span", "kind", kind), `#${number}`);
    if (stateLabel) link.append(createElement("span", "state", `· ${stateLabel}`));
    for (const signal of signals) link.append(createElement("span", `signal ${signal.tone}`, `· ${signal.label}`));
    return link;
  }

  function buildReferences(task) {
    const references = [];
    if (githubWebUrl) {
      for (const issueNumber of task.githubIssues) {
        references.push(buildReference({
          className: "issue",
          iconPaths: ISSUE_ICON_PATHS,
          kind: "Issue",
          number: issueNumber,
          url: `${githubWebUrl}/issues/${issueNumber}`,
        }));
      }
    }
    const pullRequest = task.pullRequest;
    if (pullRequest) {
      const state = PULL_REQUEST_STATES[pullRequest.isDraft && pullRequest.state === "OPEN" ? "draft" : pullRequest.state];
      references.push(buildReference({
        className: state?.className ?? "pr-open",
        iconPaths: PULL_REQUEST_ICON_PATHS,
        kind: "PR",
        number: pullRequest.number,
        url: pullRequest.url,
        stateLabel: state?.label,
        signals: pullRequest.state === "OPEN"
          ? [CHECK_SIGNALS[pullRequest.checks], REVIEW_SIGNALS[pullRequest.reviewDecision]].filter(Boolean)
          : [],
      }));
    }
    if (references.length === 0) return null;
    const container = createElement("div", "refs");
    container.append(...references);
    return container;
  }

  function buildAction(task, isNext) {
    if (task.column === "needsYou") return buildButton("Mở tab", "", () => focusTask(task));
    if (task.column === "inProgress" && task.agent) return buildButton("Mở tab", "", () => focusTask(task));
    if (task.column === "ready") {
      const button = buildButton(startingTaskIds.has(task.id) ? "Đang mở…" : "Bắt đầu", isNext ? "primary" : "", () => startTask(task));
      button.disabled = startingTaskIds.size > 0;
      return button;
    }
    if (task.column === "done" && task.worktree && !task.worktree.isMain) {
      const uncommittedFileCount = task.diffStats?.uncommittedFileCount ?? 0;
      const button = buildButton("Dọn worktree", "", () =>
        runAction("/api/clean-up", task.id, () => `Đã đóng workspace và xoá worktree của ${shortName(task.id)} (branch vẫn giữ).`),
      );
      button.disabled = uncommittedFileCount > 0;
      button.title = uncommittedFileCount > 0
        ? `Còn ${uncommittedFileCount} file chưa commit, không dọn được`
        : "Đóng workspace herdr và xoá thư mục worktree, giữ branch";
      return button;
    }
    return null;
  }

  function buildButton(label, className, onClick) {
    const button = createElement("button", className, label);
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      onClick();
    });
    return button;
  }

  function buildDiffStats(diffStats) {
    const parts = [];
    if (diffStats.filesChanged > 0) {
      parts.push(
        createElement("span", "insertions", `+${diffStats.insertions}`),
        " ",
        createElement("span", "deletions", `−${diffStats.deletions}`),
        ` · ${diffStats.filesChanged} file`,
      );
    }
    if (diffStats.uncommittedFileCount > 0) {
      if (parts.length > 0) parts.push(" · ");
      parts.push(createElement("span", "dirty", `${diffStats.uncommittedFileCount} file chưa commit`));
    }
    if (parts.length === 0) return null;
    const line = createElement("div", "diff-stats");
    line.append(...parts);
    return line;
  }

  function appendWorktreeDetails(body, item) {
    const diffStatsLine = item.diffStats && item.column !== "done" ? buildDiffStats(item.diffStats) : null;
    if (diffStatsLine) body.append(diffStatsLine);
    if (item.previewLines?.length > 0) body.append(createElement("div", "preview", item.previewLines.join("\n")));
  }

  function buildUnlinkedWorktreeRow(worktree) {
    const pseudoTask = { id: `worktree:${worktree.path}`, title: worktree.branch ?? worktree.path, agent: worktree.agent };
    const row = createElement("div", worktree.agent ? "row clickable" : "row");
    const body = createElement("div");
    body.append(createElement("div", "title", pseudoTask.title));
    const meta = createElement("div", "meta", worktree.agent ? `Claude: ${worktree.agent.status} · không khớp spec nào` : "không có phiên Claude · không khớp spec nào");
    body.append(meta);
    appendWorktreeDetails(body, worktree);
    row.append(createElement("span", "number", ""), body);
    if (worktree.agent) {
      row.append(buildButton("Mở tab", "", () => focusTask(pseudoTask)));
      row.addEventListener("click", () => focusTask(pseudoTask));
    }
    return row;
  }

  function buildUnlinkedWorktreesSection() {
    const element = createElement("section", "unlinked");
    const heading = createElement("h2");
    heading.append(createElement("span", "", "Worktree chưa gắn task"), createElement("span", "count", String(unlinkedWorktrees.length)));
    const list = createElement("div", "list");
    list.append(...unlinkedWorktrees.map(buildUnlinkedWorktreeRow));
    element.append(heading, list);
    return element;
  }

  function buildRow(task, isNext) {
    const row = createElement("div", isNext ? "row is-next" : "row");
    row.dataset.taskId = task.id;
    const body = createElement("div");
    body.append(createElement("div", "title", task.title));
    const meta = describeMeta(task, isNext);
    if (meta) body.append(meta);
    const references = buildReferences(task);
    if (references) body.append(references);
    appendWorktreeDetails(body, task);
    row.append(createElement("span", "number", task.number ?? ""), body);
    const action = buildAction(task, isNext);
    if (action) row.append(action);
    row.addEventListener("mouseenter", () => highlightRelated(task, true));
    row.addEventListener("mouseleave", () => highlightRelated(task, false));
    if (task.agent) {
      row.classList.add("clickable");
      row.addEventListener("click", (event) => {
        if (!event.target.closest("a")) focusTask(task);
      });
    }
    return row;
  }

  function sortDoneByRecency(tasks) {
    return [...tasks].sort((first, second) => {
      const firstMerged = first.pullRequest?.mergedAt ?? "";
      const secondMerged = second.pullRequest?.mergedAt ?? "";
      if (firstMerged !== secondMerged) return secondMerged.localeCompare(firstMerged);
      return second.id.localeCompare(first.id);
    });
  }

  function buildDoneList(tasks) {
    const sorted = sortDoneByRecency(tasks);
    const visible = isDoneExpanded ? sorted : sorted.slice(0, RECENT_DONE_COUNT);
    const fragment = document.createDocumentFragment();
    const list = createElement("div", "list");
    list.append(...visible.map((task) => buildRow(task, false)));
    fragment.append(list);
    if (sorted.length > RECENT_DONE_COUNT) {
      const label = isDoneExpanded ? "Thu gọn" : `Xem tất cả ${sorted.length} task đã xong`;
      const toggle = buildButton(label, "toggle", () => {
        isDoneExpanded = !isDoneExpanded;
        lastRenderedJson = "";
        render();
      });
      fragment.append(toggle);
    }
    return fragment;
  }

  function buildSection(section) {
    const tasks = tasksIn(section.key);
    const element = createElement("section", section.className ?? "");
    const heading = createElement("h2");
    heading.append(createElement("span", "", section.label), createElement("span", "count", String(tasks.length)));
    element.append(heading);
    if (section.key === "done") {
      element.append(buildDoneList(tasks));
      return element;
    }
    const list = createElement("div", "list");
    list.append(...tasks.map((task, index) => buildRow(task, section.key === "ready" && index === 0)));
    element.append(list);
    return element;
  }

  function buildIssueWithoutSpecRow(issue) {
    const row = createElement("div", "row");
    const body = createElement("div");
    body.append(createElement("div", "title", issue.title));
    const references = createElement("div", "refs");
    references.append(buildReference({
      className: "issue",
      iconPaths: ISSUE_ICON_PATHS,
      kind: "Issue",
      number: issue.number,
      url: issue.url,
    }));
    body.append(references);
    const command = `/github-issues-to-md ${issue.number} ${githubWebUrl?.replace("https://github.com/", "") ?? ""}`.trim();
    const copyButton = buildButton("Copy lệnh tạo spec", "", async () => {
      try {
        await navigator.clipboard.writeText(command);
        actionMessage = `Đã copy: ${command}`;
      } catch (error) {
        actionMessage = `Không copy được, gõ tay: ${command}`;
      }
      lastRenderedJson = "";
      render();
    });
    row.append(createElement("span", "number", ""), body, copyButton);
    return row;
  }

  function buildIssuesWithoutSpecSection() {
    const element = createElement("section", "without-spec");
    const heading = createElement("h2");
    heading.append(
      createElement("span", "", "Issue GitHub chưa có spec"),
      createElement("span", "count", String(issuesWithoutSpec.length)),
    );
    element.append(heading);
    if (isIssuesWithoutSpecExpanded) {
      const list = createElement("div", "list");
      list.append(...issuesWithoutSpec.map(buildIssueWithoutSpecRow));
      element.append(list);
    }
    const label = isIssuesWithoutSpecExpanded ? "Thu gọn" : `Xem ${issuesWithoutSpec.length} issue đang mở trên GitHub chưa có spec`;
    element.append(buildButton(label, "toggle", () => {
      isIssuesWithoutSpecExpanded = !isIssuesWithoutSpecExpanded;
      lastRenderedJson = "";
      render();
    }));
    return element;
  }

  function buildIdleHint() {
    const hasNext = tasksIn("ready").length > 0;
    return createElement(
      "div",
      "empty-hint",
      hasNext ? "Chưa có task nào đang chạy. Bấm Bắt đầu ở task Tiếp theo bên dưới." : "Chưa có task nào đang chạy và không còn task sẵn sàng.",
    );
  }

  function renderSummary() {
    const summary = document.getElementById("summary");
    summary.replaceChildren();
    SUMMARY_PARTS.forEach((part, index) => {
      if (index > 0) summary.append(" · ");
      const span = createElement("span", part.className ?? "");
      span.append(createElement("strong", "", String(tasksIn(part.key).length)), ` ${part.label}`);
      summary.append(span);
    });
  }

  function render() {
    const board = document.getElementById("board");
    board.replaceChildren();
    const hasActiveTasks = currentTasks.some((task) => ["needsYou", "inProgress", "review"].includes(task.column));
    if (!hasActiveTasks) board.append(buildIdleHint());
    for (const section of SECTIONS) {
      if (section.key === "ready" && unlinkedWorktrees.length > 0) board.append(buildUnlinkedWorktreesSection());
      if (section.key === "done" && issuesWithoutSpec.length > 0) board.append(buildIssuesWithoutSpecSection());
      if (tasksIn(section.key).length > 0) board.append(buildSection(section));
    }
    renderSummary();
    document.getElementById("banner").textContent = [actionMessage, ...currentWarnings].filter(Boolean).join("\n");
  }

  async function refreshBoard() {
    try {
      const response = await fetch("/api/board");
      const body = await response.json();
      if (!response.ok) throw new Error(body.error);
      document.getElementById("repo-name").textContent = body.repoName;
      document.title = `Board · ${body.repoName}`;
      document.getElementById("updated-at").textContent = new Date().toLocaleTimeString();
      const renderedJson = JSON.stringify([body.tasks, body.issuesWithoutSpec, body.unlinkedWorktrees, body.warnings, actionMessage]);
      if (renderedJson === lastRenderedJson) return;
      lastRenderedJson = renderedJson;
      currentTasks = body.tasks;
      currentWarnings = body.warnings;
      githubWebUrl = body.githubWebUrl;
      issuesWithoutSpec = body.issuesWithoutSpec;
      unlinkedWorktrees = body.unlinkedWorktrees;
      render();
    } catch (error) {
      document.getElementById("banner").textContent = `Không đọc được board: ${error.message}`;
    }
  }

  refreshBoard();
  setInterval(refreshBoard, BOARD_REFRESH_MS);
</script>
</body>
</html>
