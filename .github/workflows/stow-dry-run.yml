name: stow-dry-run

on:
  pull_request:
    paths:
      - ".config/**"
      - ".claude/**"
      - ".codex/**"
      - ".gemini/**"
      - "scripts/**"
      - ".github/workflows/stow-dry-run.yml"
  push:
    branches: [master]
    paths:
      - ".config/**"
      - ".claude/**"
      - ".codex/**"
      - ".gemini/**"
      - "scripts/**"
      - ".github/workflows/stow-dry-run.yml"

jobs:
  stow-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y stow
      - name: Simulate symlinks
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          for dir in .config .claude .codex .gemini scripts; do
            stow -n --target="$RUNNER_TEMP/home" "$dir"
          done
