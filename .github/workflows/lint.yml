name: lint

on:
  pull_request:
  push:
    branches: [master]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          git ls-files -z scripts install.sh .claude/hooks .claude/*.sh \
            | xargs -0 grep -lE '^#!(/usr/bin/env |/(usr/)?bin/)(ba)?sh$' \
            | xargs shellcheck -S error

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luarocks
      - run: sudo luarocks install luacheck
      - name: Run luacheck
        run: luacheck .config/nvim || [ $? -eq 1 ]

  stow-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y stow
      - name: Simulate symlinks
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          for dir in .config .claude .codex .gemini scripts; do
            stow -n --target="$RUNNER_TEMP/home" "$dir"
          done
