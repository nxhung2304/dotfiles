name: lint-lua

on:
  pull_request:
    paths:
      - ".config/nvim/**"
      - ".luacheckrc"
      - ".github/workflows/lint-lua.yml"
  push:
    branches: [master]
    paths:
      - ".config/nvim/**"
      - ".luacheckrc"
      - ".github/workflows/lint-lua.yml"

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luarocks
      - run: sudo luarocks install luacheck
      - name: Run luacheck
        run: luacheck .config/nvim || [ $? -eq 1 ]
