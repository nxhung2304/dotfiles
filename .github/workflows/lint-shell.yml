name: lint-shell

on:
  pull_request:
    paths:
      - "scripts/**"
      - "install.sh"
      - ".claude/**"
      - ".github/workflows/lint-shell.yml"
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "install.sh"
      - ".claude/**"
      - ".github/workflows/lint-shell.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          git ls-files -z scripts install.sh .claude/hooks .claude/*.sh \
            | xargs -0 grep -lE '^#!(/usr/bin/env |/(usr/)?bin/)(ba)?sh$' \
            | xargs shellcheck -S error
